<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How You Feel About Me? 💖</title>
    <link rel="stylesheet" href="ilu.css">
</head>
<body>

    <!-- Floating hearts background -->
    <div class="hearts-bg" id="heartsBg"></div>

    <div class="container">
        <div class="heart-icon">❤️</div>
        <h1 class="question">How do you feel about me?</h1>
        <p class="subtitle">💌 Choose one option below, my love...</p>

        <div class="options">
            <button class="option-btn" data-choice="Your Dream">
                <span class="emoji">🌈</span> Your Dream
            </button>
            <button class="option-btn" data-choice="Your Husband">
                <span class="emoji">💍</span> Your Husband
            </button>
            <button class="option-btn" data-choice="Your Baby">
                <span class="emoji">🍼</span> Your Baby
            </button>
            <button class="option-btn" data-choice="Your Forever">
                <span class="emoji">♾️</span> Your Forever
            </button>
            <button class="option-btn" data-choice="Your Everything">
                <span class="emoji">💎</span> Your Everything
            </button>
            <button class="option-btn" data-choice="Your Soulmate">
                <span class="emoji">💫</span> Your Soulmate
            </button>
        </div>
    </div>

    <!-- Hidden audio for random song -->
    <audio id="bgAudio" loop></audio>

    <script src="ilu.js"></script>
</body>
</html>
